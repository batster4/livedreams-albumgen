[project]
name = "albumgen"
version = "1.0.0"
description = "Story and prompt generator for one-reference canvas albums (shot 1 + 15 pages)"
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "pydantic>=2.6", "pyyaml>=6", "typer>=0.12", "httpx>=0.27", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
albumgen = "albumgen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["albumgen"]
